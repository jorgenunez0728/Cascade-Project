name: Avisos del laboratorio (resumen diario, plan aceptado y estatus CoP)

# [3.5.0] Inicio de turno (7:00–7:55) y fin de turno (16:00–16:55), cada 5 min, lunes a viernes
# (México, UTC−6 fijo). Tantos intentos porque GitHub omite y atrasa sus tareas programadas.
# El verificador (tools/digest-check.node.js) lee solo digest/state: si el resumen de ese turno
# ya salió, el envío ni arranca. Nunca sale dos veces el mismo turno (digestSlotDue).
on:
  schedule:
    - cron: '*/5 13 * * 1-5'
    - cron: '*/5 22 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo vista previa (no envía nada ni guarda estado)'
        type: boolean
        default: true
      force_digest:
        description: 'Mandar el resumen aunque ya haya salido hoy'
        type: boolean
        default: false
      force_cop:
        description: 'Mandar el estatus CoP semanal aunque no sea viernes o ya haya salido'
        type: boolean
        default: false
      test_to:
        description: 'Enviar una PRUEBA solo a este correo (si lo llenas, se envía aunque esté marcada la vista previa; sin copia al jefe ni avisos al teléfono)'
        type: string
        default: ''
      limpiar_duplicados:
        description: 'Limpiar documentos duplicados de vehículos en la nube (en vez de los avisos). "revisar" solo muestra la lista'
        type: choice
        options: ['no', 'revisar', 'aplicar']
        default: 'no'

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      due: ${{ steps.v.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - name: ¿Ya salió el resumen de este turno?
        id: v
        env:
          FB_LAB_PASSWORD: ${{ secrets.FB_LAB_PASSWORD }}
        run: node tools/digest-check.node.js

  digest:
    needs: check
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.due == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del envío
        run: npm install --no-save --no-package-lock --ignore-scripts nodemailer@6.9.16 web-push@3.6.7

      - name: Limpiar duplicados de vehículos
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.limpiar_duplicados != 'no' }}
        env:
          FB_LAB_PASSWORD: ${{ secrets.FB_LAB_PASSWORD }}
          DEDUPE_APPLY: ${{ inputs.limpiar_duplicados == 'aplicar' && '1' || '' }}
        run: node tools/vehicle-dedupe.node.js

      - name: Enviar avisos
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.limpiar_duplicados == 'no' }}
        env:
          FB_LAB_PASSWORD: ${{ secrets.FB_LAB_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_digest && '1' || '' }}
          FORCE_COP: ${{ github.event_name == 'workflow_dispatch' && inputs.force_cop && '1' || '' }}
          DIGEST_TEST_TO: ${{ github.event_name == 'workflow_dispatch' && inputs.test_to || '' }}
          DIGEST_OUT: ${{ runner.temp }}
        run: node tools/daily-digest.node.js

      - name: Guardar la vista previa
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.limpiar_duplicados == 'no' }}
        uses: actions/upload-artifact@v4
        with:
          name: vista-previa-avisos
          path: ${{ runner.temp }}/*.html
          if-no-files-found: ignore
          retention-days: 7
