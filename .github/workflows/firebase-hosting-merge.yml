name: Deploy to Firebase Hosting on merge to main

on:
  push:
    branches:
      - main
  # v16.7: escape hatch manual — el trigger normal (push a main) dejó de disparar el 5 de
  # agosto por una interrupción general de GitHub Actions (githubstatus.com, "Incident with
  # Actions" — runners recibiendo jobs inválidos). No es config/billing del repo (revisado y
  # correcto). workflow_dispatch permite forzar el deploy desde la pestaña Actions → este
  # workflow → "Run workflow" sin depender de que el push-trigger se recupere solo.
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (deben pasar antes de desplegar)
        run: npm test

      - name: Build unified HTML and assemble dist/
        run: bash deploy.sh --dry

      # v15.6: desplegar las Security Rules versionadas en el repo.
      # continue-on-error: si el service account no tiene el rol
      # firebaserules.admin, publicar las reglas manualmente desde la consola
      # (Firestore → Reglas → pegar firestore.rules → Publicar).
      - name: Deploy Firestore Security Rules
        id: rules
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@13 deploy --only firestore:rules --project kia-emlab-test-system --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      # continue-on-error hacía que un fallo de las reglas saliera en VERDE: desde que
      # existe este paso la cuenta de servicio recibe 403 y la base de producción nunca
      # recibió firestore.rules. Ahora queda como anotación de error en la ejecución.
      - name: Avisar si las reglas de seguridad NO se publicaron
        if: steps.rules.outcome == 'failure'
        run: |
          echo "::error title=Reglas de Firestore sin publicar::La cuenta de servicio no pudo publicar firestore.rules (ver el paso anterior). Producción sigue con las reglas que tenga la consola. Dar el rol 'Firebase Rules Admin' a la cuenta de servicio, o publicar firestore.rules desde la consola (Firestore → Reglas)."
          {
            echo "### ⚠️ Reglas de Firestore sin publicar"
            echo "La cuenta de servicio de CI no tiene permiso para publicar \`firestore.rules\`."
            echo "Producción sigue con las reglas que tenga la consola de Firebase."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: kia-emlab-test-system
